[project]
name = "benchbot"
version = "0.1.0"
description = "Voice-triggered record & replay for the SO-101 repair-bench helper"
requires-python = ">=3.10"
dependencies = [
    "lerobot[feetech]>=0.4",
    "faster-whisper>=1.0",
    "sounddevice>=0.4",
    "numpy",
    "rapidfuzz",
]

[tool.uv]
# If lerobot[feetech] wheels fight you, install from source instead:
#   uv pip install -e "/path/to/lerobot[feetech]"
