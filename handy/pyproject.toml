[project]
name = "handy"
version = "0.1.0"
description = "Handy: voice-triggered record & replay for the SO-101 repair-bench helper"
requires-python = ">=3.10"
dependencies = [
    "lerobot[feetech]>=0.4",
    "faster-whisper>=1.0",
    "sounddevice>=0.4",
    "numpy",
    "rapidfuzz",
    "opencv-python",
    "placo",            # adjust.py kinematics
    "transformers>=5.0",  # samseg.py: SAM 3 + SAM 2 (visual_servoing.py)
    "torchvision",
]

[tool.uv]
# If lerobot[feetech] wheels fight you, install from source instead:
#   uv pip install -e "/path/to/lerobot[feetech]"
